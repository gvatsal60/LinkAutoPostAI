name: Post on Social Media at 9 AM
permissions:
  pull-requests: read
  contents: read
on:
  #  schedule:
  #    - cron: '30 3 * * *' # codespell:ignore; Runs at 3:30 AM UTC every day (9:00 AM IST)
  #      Temporarily disabled; re-enable when automated posting is required.
  workflow_dispatch: # Optional, allows manual trigger from GitHub UI
jobs:
  run-daily-task:
    runs-on: ubuntu-latest
    environment: SocialMediaPost
    steps:
      # Checkout the code
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install uv tool
      - name: Install uv
        uses: step-security/setup-uv@7e018fee7f2f085a7d0e76b2ae75727698cd887e # v10.3.0
      # Run the application
      - name: Run App
        env:
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          make run
